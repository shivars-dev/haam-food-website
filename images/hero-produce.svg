  <circle cx="75" cy="120" r="7" fill="#f5921b" opacity="0.45"/>
  <circle cx="350" cy="300" r="8" fill="#6b4b8a" opacity="0.35"/>
  <circle cx="80" cy="290" r="6" fill="#e0522f" opacity="0.4"/>
